            "@type": "Answer",
            "text": "Full stack web applications with React, Vue.js, TypeScript, Node.js and PostgreSQL. His flagship work: TaskFlow (a task manager with JWT auth and role-based access control enforced in the service layer, 44 tests) and DocVault (a document system with a five-permission matrix enforced on both the UI and the API, 15 tests). Both are live and open source."
          }
        },

          "@type": "Question",
          "name": "Is Manideep Daram available for hire?",

            "@type": "Answer",
            "text": "Yes. He is open to Full Stack Developer roles and internships, based in Hyderabad, India. The fastest routes are the contact form on this page or email at manideepdaram@gmail.com."
          }
        },
        {
          "@type": "Question",
          "name": "How does Manideep Daram handle access control?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "One permission matrix, two readers. In DocVault a single can(role, permission) function defines five permissions across viewer, reviewer and admin roles; the UI gates rendering from it and every API route enforces it. In TaskFlow, role checks live in the service layer, so a member cannot delete a project even by calling the API directly. Hiding a button is not security — the refused request is."
          }
        },
