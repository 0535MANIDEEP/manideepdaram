name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, and let the newest queued run win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci
        working-directory: client

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        working-directory: client
        env:
          # Left blank on purpose. The repo has no secrets, so the deployed site
          # uses the mailto: fallback until a form endpoint is added.
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT }}
          VITE_OWNER_EMAIL: ${{ vars.VITE_OWNER_EMAIL }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A green build says nothing about what Pages actually served. A wrong base
  # path, a stale cache or a failed upload all produce a green build and a broken
  # site, and a blank page is the version of that nobody notices.
  #
  # This cannot check the rendered DOM without a headless browser, which is not
  # worth the runner time. What it does check is that the deployed document is
  # the real one and that every asset it references resolves. The client side
  # render itself is gated by the render test in the build job.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages to propagate
        run: sleep 20

      - name: The deployed page is the real document
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "checking $url"
          html=$(curl -fsSL --retry 5 --retry-delay 10 "$url")
          echo "$html" | grep -q 'id="root"' || { echo "::error::no #root in the deployed page"; exit 1; }
          echo "$html" | grep -qE '<title>[^<]{10,}</title>' || { echo "::error::no real title"; exit 1; }
          echo "$html" | grep -q 'name="description"' || { echo "::error::no meta description"; exit 1; }
          echo "ok, the deployed document looks right"

      - name: Every asset the page references resolves
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for asset in $(curl -fsSL "$url" | grep -oE '(src|href)="/[^"]+\.(js|css)"' | sed -E 's/.*"([^"]+)"/\1/'); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url$asset")
            if [ "$code" != "200" ]; then
              echo "::error::$asset returned $code"
              exit 1
            fi
            echo "  ok $asset"
          done
          echo "ok, all referenced assets resolve"
